<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Analyst Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --border:   #2a2d3a;
    --text:     #e2e4ec;
    --muted:    #7a7f9a;
    --accent:   #4f8ef7;
    --low:      #3b8a52;
    --low-bg:   #1a2e22;
    --med:      #c9820a;
    --med-bg:   #2e2010;
    --high:     #c94040;
    --high-bg:  #2e1414;
    --tag-bg:   #232638;
    --row-hover:#21253a;
  }

  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
  header h1 span { color: var(--accent); }

  .stat-cards { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
  .stat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    text-align: center;
    min-width: 80px;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; }
  .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card.low  .num { color: #4caf6e; }
  .stat-card.med  .num { color: #f0a030; }
  .stat-card.high .num { color: #e05555; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    gap: 10px;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input, .toolbar select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    outline: none;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  .toolbar input { flex: 1; min-width: 200px; }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn:hover { opacity: 0.88; }
  .btn.secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  #status-bar { margin-left: auto; font-size: 12px; color: var(--muted); }

  /* ── Alert table ── */
  .table-wrap { overflow-x: auto; padding: 0 24px 24px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    max-width: 300px;
  }
  tr:hover td { background: var(--row-hover); cursor: pointer; }

  /* severity badge */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.low  { background: var(--low-bg);  color: #4caf6e; }
  .badge.med  { background: var(--med-bg);  color: #f0a030; }
  .badge.high { background: var(--high-bg); color: #e05555; }

  /* rule group tags */
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    background: var(--tag-bg);
    color: var(--muted);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: monospace;
  }
  .tag.attack     { color: #e05555; background: #2e1414; }
  .tag.soc_sim    { display: none; }  /* hide noisy base tag */

  /* truncated text */
  .mono { font-family: monospace; font-size: 12px; word-break: break-all; }
  .clip { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* AI verdict pill */
  .verdict { font-size: 12px; font-style: italic; color: var(--muted); }
  .verdict.pending { color: var(--muted); }
  .verdict.available { color: #a78bfa; font-style: normal; }

  /* ── Detail panel (slide-in from right) ── */
  .panel-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
  }
  .panel-overlay.open { display: block; }
  .panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(600px, 100vw);
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 24px;
    z-index: 101;
    transform: translateX(100%);
    transition: transform 0.22s ease;
  }
  .panel.open { transform: translateX(0); }
  .panel h2 { font-size: 15px; margin-bottom: 16px; }
  .panel .close-btn {
    position: absolute; top: 20px; right: 20px;
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; line-height: 1;
  }
  .field-group { margin-bottom: 14px; }
  .field-group label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field-group .value {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: monospace;
    word-break: break-all;
    white-space: pre-wrap;
    min-height: 36px;
  }
  /* highlight injection payload in UA */
  .injection-warning {
    margin-top: 6px;
    background: #2e1414;
    border: 1px solid #5a2020;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: #e05555;
  }
  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* AI section placeholder */
  .ai-section {
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 16px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
  }
  .empty-state h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>SOC <span>Analyst</span> Dashboard</h1>
  <div class="stat-cards">
    <div class="stat-card"><div class="num" id="stat-total">—</div><div class="label">Total</div></div>
    <div class="stat-card low"><div class="num" id="stat-low">—</div><div class="label">Low</div></div>
    <div class="stat-card med"><div class="num" id="stat-med">—</div><div class="label">Medium</div></div>
    <div class="stat-card high"><div class="num" id="stat-high">—</div><div class="label">High</div></div>
  </div>
</header>

<div class="toolbar">
  <input type="text" id="search-input" placeholder="Search IP, path, user-agent, rule…" />
  <select id="group-filter">
    <option value="">All groups</option>
    <option value="web">web</option>
    <option value="auth">auth</option>
    <option value="endpoint">endpoint</option>
    <option value="network">network</option>
  </select>
  <select id="hours-filter">
    <option value="1">Last 1 hour</option>
    <option value="6">Last 6 hours</option>
    <option value="24" selected>Last 24 hours</option>
    <option value="168">Last 7 days</option>
  </select>
  <button class="btn" onclick="loadAlerts()">Refresh</button>
  <span id="status-bar">—</span>
</div>

<div class="table-wrap">
  <div id="table-container" class="loading">Loading alerts…</div>
</div>

<!-- Detail panel -->
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="detail-panel">
  <button class="close-btn" onclick="closePanel()">✕</button>
  <h2>Alert detail</h2>
  <div id="panel-content"></div>
</div>

<script>
let allAlerts = [];

function severityClass(level) {
  if (level >= 11) return 'high';
  if (level >= 7)  return 'med';
  return 'low';
}

function severityLabel(level) {
  if (level >= 11) return 'High';
  if (level >= 7)  return 'Medium';
  return 'Low';
}

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleString('en-GB', {
    month: 'short', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

function hasInjection(ua) {
  const lower = (ua || '').toLowerCase();
  return lower.includes('ignore previous') ||
         lower.includes('classify') ||
         lower.includes('you are now') ||
         lower.includes('disregard') ||
         lower.includes('act as');
}

function renderTable(alerts) {
  const container = document.getElementById('table-container');

  if (!alerts.length) {
    container.innerHTML = `<div class="empty-state">
      <h3>No alerts found</h3>
      <p>Try running the traffic generators or adjusting the time window.</p>
    </div>`;
    return;
  }

  const rows = alerts.map((a, i) => {
    const sev = severityClass(a.rule_level);
    const tags = (a.rule_groups || [])
      .map(g => {
        const isAttack = ['attack','brute_force','sql_injection','scanner'].includes(g);
        return `<span class="tag ${isAttack ? 'attack' : ''}">${g}</span>`;
      }).join('');

    const injFlag = hasInjection(a.user_agent)
      ? '<span class="badge high" title="Prompt injection in UA">⚠ Injection</span> '
      : '';

    return `<tr onclick="openPanel(${i})">
      <td style="white-space:nowrap;color:var(--muted);font-size:12px">${fmtTime(a.timestamp)}</td>
      <td><span class="badge ${sev}">${severityLabel(a.rule_level)}</span></td>
      <td style="font-size:12px;color:var(--muted)">${a.rule_id}</td>
      <td>${injFlag}${a.rule_desc}</td>
      <td class="mono">${a.src_ip || '—'}</td>
      <td class="mono clip">${a.path || '—'}</td>
      <td><div class="tags">${tags}</div></td>
      <td><span class="verdict pending">${a.ai_verdict || 'Pending'}</span></td>
    </tr>`;
  }).join('');

  container.innerHTML = `<table>
    <thead><tr>
      <th>Time</th>
      <th>Severity</th>
      <th>Rule</th>
      <th>Description</th>
      <th>Source IP</th>
      <th>Path</th>
      <th>Groups</th>
      <th>AI verdict</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function openPanel(idx) {
  const a = allAlerts[idx];
  if (!a) return;

  const sev = severityClass(a.rule_level);
  const injWarn = hasInjection(a.user_agent)
    ? `<div class="injection-warning">
        ⚠ <strong>Prompt injection detected in User-Agent.</strong><br>
        This request contains an instruction payload designed to manipulate an AI analyst.
        The behavioral alert above was fired on <em>traffic patterns</em>, not this content.
       </div>`
    : '';

  document.getElementById('panel-content').innerHTML = `
    <div class="field-group">
      <label>Severity</label>
      <div class="value"><span class="badge ${sev}">${severityLabel(a.rule_level)} (level ${a.rule_level})</span></div>
    </div>
    <div class="field-group">
      <label>Rule</label>
      <div class="value">${a.rule_id} — ${a.rule_desc}</div>
    </div>
    <div class="field-group">
      <label>Groups</label>
      <div class="value">${(a.rule_groups || []).join(', ') || '—'}</div>
    </div>
    <hr class="divider">
    <div class="field-group">
      <label>Timestamp</label>
      <div class="value">${a.timestamp || '—'}</div>
    </div>
    <div class="field-group">
      <label>Source IP</label>
      <div class="value">${a.src_ip || '—'}</div>
    </div>
    <div class="field-group">
      <label>Host</label>
      <div class="value">${a.host || '—'}</div>
    </div>
    <div class="field-group">
      <label>Method / Path / Status</label>
      <div class="value">${a.method || '—'} ${a.path || '—'} → ${a.status_code || '—'}</div>
    </div>
    <div class="field-group">
      <label>User-Agent</label>
      <div class="value">${a.user_agent || '—'}</div>
      ${injWarn}
    </div>
    <div class="field-group">
      <label>Query string</label>
      <div class="value">${a.query || '—'}</div>
    </div>
    <div class="field-group">
      <label>Request body</label>
      <div class="value">${a.request_body || '—'}</div>
    </div>
    <hr class="divider">
    <div class="field-group">
      <label>AI Analysis</label>
      <div class="ai-section">
        AI analyst not yet connected.<br>
        Next step: wire up Claude to triage this alert automatically.
      </div>
    </div>
  `;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const s = await res.json();
    if (s.error) return;
    document.getElementById('stat-total').textContent = s.total ?? '—';
    document.getElementById('stat-low').textContent   = s.by_level?.low    ?? '—';
    document.getElementById('stat-med').textContent   = s.by_level?.medium ?? '—';
    document.getElementById('stat-high').textContent  = s.by_level?.high   ?? '—';
  } catch(e) { /* indexer not ready yet */ }
}

async function loadAlerts() {
  const search = document.getElementById('search-input').value.trim();
  const group  = document.getElementById('group-filter').value;
  const hours  = document.getElementById('hours-filter').value;

  document.getElementById('status-bar').textContent = 'Loading…';
  document.getElementById('table-container').innerHTML = '<div class="loading">Loading…</div>';

  const params = new URLSearchParams({ hours, group, search });
  try {
    const res = await fetch(`/api/alerts?${params}`);
    allAlerts = await res.json();

    if (allAlerts[0]?._error) {
      document.getElementById('table-container').innerHTML =
        `<div class="empty-state"><h3>Cannot reach OpenSearch</h3><p>${allAlerts[0]._error}</p></div>`;
      document.getElementById('status-bar').textContent = 'Connection error';
      return;
    }

    renderTable(allAlerts);
    document.getElementById('status-bar').textContent =
      `${allAlerts.length} alert${allAlerts.length !== 1 ? 's' : ''} · ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    document.getElementById('status-bar').textContent = 'Error: ' + e.message;
  }

  loadStats();
}

// Search on enter
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadAlerts();
});

// Initial load
loadAlerts();
// Auto-refresh every 30s
setInterval(loadAlerts, 30000);
</script>
</body>
</html>
