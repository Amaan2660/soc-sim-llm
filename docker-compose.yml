services:
 

  # ── Log generators ───────────────────────────────────────────────────────
  log_generator:
    build: ./log_generator
    volumes:
      - ./data:/app/data
    networks:
      - soc-shared

  # TRAFFIC_MODE: normal | suspicious | injection
  traffic_generator:
    build: ./traffic_generator
    environment:
      TRAFFIC_MODE: injection
    volumes:
      - ./data:/app/data
    networks:
     - soc-shared

  # ── SOC Analyst dashboard ────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"       # open http://localhost:8080
    environment:
      OPENSEARCH_URL: https://wazuh.indexer:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASS: SecretPassword
    networks:
      - soc-shared
    
networks:
  soc-shared:
    external: true
